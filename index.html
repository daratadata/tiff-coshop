<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b08"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png"><title>TIFF & CO</title>
<style>
:root{--g:#d4a85a;--g2:#f3d99b;--bg:#0d0b08;--c:#1a160f;--t:#f5efe3;--m:#a79c88}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;padding-bottom:90px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;position:sticky;top:0;background:#0d0b08ee;backdrop-filter:blur(8px);z-index:5}
header img{height:42px;border-radius:50%}button{font:inherit;cursor:pointer;border:0}
.ic{background:var(--c);color:var(--g);border-radius:20px;padding:8px 14px;margin-left:6px}
.hero{height:52vh;min-height:340px;position:relative;touch-action:pan-y}#cv{width:100%;height:100%;display:block}
.hero p{position:absolute;bottom:8px;width:100%;text-align:center;color:var(--m);font-size:12px}
h1,h2{font-family:Georgia,serif;font-weight:400}.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0}
.tabs button{background:var(--c);color:var(--m);padding:10px 18px;border-radius:24px}.tabs .on{background:linear-gradient(135deg,var(--g),var(--g2));color:#111}
.card{background:var(--c);margin:14px 16px;padding:18px;border-radius:20px;border:1px solid #3a2f1c}
.card h2{color:var(--g2);font-size:24px}.price{color:var(--g);margin:6px 0;font-size:14px}
.row{display:flex;align-items:center;gap:10px;margin-top:12px}.q button{background:#2a2316;color:var(--g);width:38px;height:38px;border-radius:50%}
.cta{flex:1;background:linear-gradient(135deg,var(--g),var(--g2));color:#111;padding:13px;border-radius:26px;font-weight:700}
.dr{position:fixed;inset:0;background:#000b;display:none;z-index:10;align-items:flex-end}.dr.on{display:flex}
.sh{background:var(--c);width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}
input,select,textarea{width:100%;background:#0d0b08;color:var(--t);border:1px solid #3a2f1c;border-radius:12px;padding:12px;margin:5px 0;font:inherit}
.it{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2316}
.st{display:flex;gap:4px;margin-top:8px}.st i{flex:1;height:5px;border-radius:3px;background:#2a2316}.st i.d{background:var(--g)}
.wa{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;text-decoration:none;z-index:6}
small{color:var(--m)}
</style></head><body>
<header><img src="img/logo.jpg" alt="TIFF & CO"><div><button class="ic" id="bG" style="display:none">⚙ Gestion</button><button class="ic" id="bO">Mes commandes</button><button class="ic" id="bA">Connexion</button><button class="ic" id="bC">🛍 <b id="n">0</b></button></div></header>
<div class="hero"><canvas id="cv"></canvas><p>Faites glisser pour tourner le produit ↻</p></div>
<div class="tabs"><button class="on" data-p="savon">Savon noir</button><button data-p="karite">Beurre de karité</button></div>
<div id="list"></div>
<div class="dr" id="dC"><div class="sh"><h2>Mon panier</h2><div id="ci"></div><h2 id="tot" style="margin:12px 0"></h2>
<input id="nm" placeholder="Nom complet"><input id="ph" placeholder="Téléphone" inputmode="tel"><select id="zn"></select><textarea id="ad" placeholder="Adresse / repère de livraison"></textarea>
<div class="row"><button class="cta" id="ok">Commander</button><button class="ic" data-x>Fermer</button></div></div></div>
<div class="dr" id="dA"><div class="sh"><h2>Espace client</h2><small>Connexion par numéro de téléphone</small>
<input id="ap" placeholder="Numéro de téléphone" inputmode="tel"><input id="aw" type="password" placeholder="Mot de passe (6 car. min.)">
<div class="row"><button class="cta" id="in">Se connecter</button><button class="ic" id="up">Créer le compte</button></div><div class="row"><button class="ic" data-x>Fermer</button></div></div></div>
<div class="dr" id="dG"><div class="sh"><h2>Espace gestionnaire</h2><div class="tabs" id="gt"><button class="on" data-g="o">Commandes</button><button data-g="z">Livraison</button><button data-g="t">Tarifs</button><button data-g="s">Stock</button></div><div id="gv"></div><div class="row"><button class="ic" data-x>Fermer</button></div></div></div>
<div class="dr" id="dO"><div class="sh"><h2>Suivi de mes commandes</h2><div id="ol"></div><div class="row"><button class="ic" data-x>Fermer</button></div></div></div>
<a class="wa" href="https://wa.me/2250173053238" target="_blank" rel="noopener">✆</a>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='',SUPA_KEY='',WA='2250173053238';
const sb=SUPA_URL?supabase.createClient(SUPA_URL,SUPA_KEY):null;
let TF={detail:1000,gros:800,gros_min:10,demi:20000,carton:40000,carton2:35000},isAdm=false;
const sv=q=>{const c=Math.floor(q/50),r=q%50;return c*(c>=2?TF.carton2:TF.carton)+(r>=25?TF.demi+(r-25)*TF.gros:r>=TF.gros_min?r*TF.gros:r*TF.detail)};
const P={savon:{name:'Savon noir du Nigeria',d:"Savon traditionnel d'origine naturelle, apprécié pour ses propriétés nettoyantes et exfoliantes : il élimine les impuretés, nettoie en profondeur et désobstrue les pores.",b:['Aide à lutter contre les imperfections et les boutons','Nettoie la peau en profondeur','Aide à éliminer les cellules mortes','Peau plus douce et éclatante','Visage et corps, selon la tolérance de la peau'],tiers:()=>`Détail ${F(TF.detail)} · Gros (dès ${TF.gros_min}) ${F(TF.gros)} · Demi-carton (25) ${F(TF.demi)} · Carton (50) ${F(TF.carton)} · dès 2 cartons ${F(TF.carton2)} le carton`,total:sv},
karite:{name:'Beurre de karité de Korhogo',d:'100 % naturel, soin traditionnel nourrissant, hydratant et protecteur : prévient le dessèchement de la peau et maintient sa souplesse.',b:['Nourrit intensément la peau','Aide à lutter contre la sécheresse cutanée','Adoucit et assouplit la peau','Protège des agressions extérieures','Peut aussi nourrir les cheveux secs'],tiers:()=>F(PK)+' la boîte',total:q=>q*PK}};
let PK=1000,cart={},cur='savon',user=null,zones=[{name:'Abidjan',fee:0},{name:'Hors Abidjan',fee:0}];
const $=s=>document.querySelector(s),F=n=>n.toLocaleString('fr-FR')+' F',tot=()=>Object.entries(cart).reduce((s,[k,q])=>s+P[k].total(q),0);
// 3D
const cv=$('#cv'),R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true}),S=new THREE.Scene(),Cm=new THREE.PerspectiveCamera(40,1,.1,50);Cm.position.set(0,.6,6);
S.add(new THREE.AmbientLight(0xffffff,.7));const L=new THREE.DirectionalLight(0xfff0d0,1.1);L.position.set(3,4,5);S.add(L);const L2=new THREE.PointLight(0xd4a85a,1.2,20);L2.position.set(-4,-1,3);S.add(L2);
const tl=new THREE.TextureLoader(),T=u=>tl.load(u),G={};
G.savon=new THREE.Group();[[0,0,0],[.3,1.0,-.3]].forEach(([x,y,z],i)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,.8,1.4),new THREE.MeshStandardMaterial({map:T('img/'+(i?'savon2':'savon')+'.jpg'),roughness:.8}));b.position.set(x,y-.5,z);b.rotation.y=i*.5;G.savon.add(b)});
G.karite=new THREE.Group();const jm=new THREE.Mesh(new THREE.CylinderGeometry(1.2,.95,1.3,48),new THREE.MeshStandardMaterial({map:T('img/karite.jpg'),roughness:.5}));
const lid=new THREE.Mesh(new THREE.CylinderGeometry(1.28,1.28,.25,48),new THREE.MeshStandardMaterial({color:0xf3ead0,transparent:true,opacity:.75,roughness:.2}));lid.position.y=.75;G.karite.add(jm,lid);
Object.values(G).forEach(g=>{g.visible=false;S.add(g)});G.savon.visible=true;
const pts=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(Array.from({length:240},()=>(Math.random()-.5)*12),3)),new THREE.PointsMaterial({color:0xd4a85a,size:.04}));S.add(pts);
let rx=0,vx=.006,dn=0,lx=0;cv.onpointerdown=e=>{dn=1;lx=e.clientX};addEventListener('pointerup',()=>dn=0);addEventListener('pointermove',e=>{if(dn){rx+=(e.clientX-lx)*.01;lx=e.clientX}});
function rs(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);R.setPixelRatio(devicePixelRatio);Cm.aspect=w/h;Cm.updateProjectionMatrix()}addEventListener('resize',rs);rs();
(function a(t){requestAnimationFrame(a);if(!dn)rx+=vx;const g=G[cur];g.rotation.y=rx;g.position.y=Math.sin(Date.now()/700)*.08;g.rotation.x=.25;pts.rotation.y+=.0008;R.render(S,Cm)})();
// UI
function draw(){$('#list').innerHTML=Object.entries(P).filter(([k])=>k==cur).map(([k,p])=>`<div class="card"><h2>${p.name}</h2><p>${p.d}</p><ul style="margin:10px 0 0 18px;color:var(--m);font-size:14px;line-height:1.6">${p.b.map(x=>'<li>'+x+'</li>').join('')}</ul><div class="price">${p.tiers()}</div><div class="row"><span class="q"><button data-m="${k}">−</button> <b>${cart[k]||0}</b> <button data-a="${k}">+</button></span><button class="cta" data-a="${k}">Ajouter au panier</button></div></div>`).join('');
$('#n').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.p;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));Object.entries(G).forEach(([k,g])=>g.visible=k==cur);draw()});
document.addEventListener('click',e=>{const t=e.target,a=t.dataset.a,m=t.dataset.m;if(a){cart[a]=(cart[a]||0)+1;draw()}if(m){cart[m]=Math.max(0,(cart[m]||0)-1);if(!cart[m])delete cart[m];draw()}if('x'in t.dataset)t.closest('.dr').classList.remove('on');if(t.classList.contains('dr'))t.classList.remove('on')});
const fz=()=>zones[+$('#zn').value||0]?.fee||0,upT=()=>$('#tot').textContent='Total : '+F(tot()+fz());$('#zn').onchange=upT;
const op=id=>$(id).classList.add('on');
$('#bC').onclick=()=>{$('#ci').innerHTML=Object.entries(cart).map(([k,q])=>`<div class="it"><span>${P[k].name} × ${q}</span><b>${F(P[k].total(q))}</b></div>`).join('')||'<small>Panier vide</small>';$('#zn').innerHTML=zones.map((z,i)=>`<option value="${i}">${z.name}${z.fee?' (+'+F(z.fee)+')':''}</option>`).join('');upT();if(user)$('#ph').value=user.user_metadata?.phone||'';op('#dC')};
$('#bA').onclick=async()=>{if(user&&sb){await sb.auth.signOut();user=null;isAdm=false;$('#bG').style.display='none';$('#bA').textContent='Connexion';return}op('#dA')};
const em=p=>p.replace(/\D/g,'')+'@tiffco.ci';
async function auth(up){const p=$('#ap').value,w=$('#aw').value;if(!sb)return alert('Mode démo : renseignez SUPA_URL et SUPA_KEY dans index.html');const r=up?await sb.auth.signUp({email:em(p),password:w,options:{data:{phone:p}}}):await sb.auth.signInWithPassword({email:em(p),password:w});if(r.error)return alert(r.error.message);user=r.data.user;$('#bA').textContent='Déconnexion';$('#dA').classList.remove('on');who()}
$('#in').onclick=()=>auth(0);$('#up').onclick=()=>auth(1);
$('#ok').onclick=async()=>{if(!tot())return;const o={name:$('#nm').value,phone:$('#ph').value,zone:zones[+$('#zn').value]?.name,fee:fz(),address:$('#ad').value,items:Object.entries(cart).map(([k,q])=>({id:k,name:P[k].name,qty:q,pu:Math.round(P[k].total(q)/q)})),total:tot()+fz()};
if(!o.name||!o.phone)return alert('Nom et téléphone requis');
if(sb){if(!user)return alert('Connectez-vous pour commander');const r=await sb.from('orders').insert(o);if(r.error)return alert(r.error.message)}else{const l=JSON.parse(localStorage.o||'[]');l.push({...o,status:'en_attente',paid:false,created_at:new Date()});localStorage.o=JSON.stringify(l)}
const msg=`Bonjour TIFF & CO, commande de ${o.name} (${o.phone}) :\n`+o.items.map(i=>`- ${i.name} × ${i.qty}`).join('\n')+`\nTotal : ${F(o.total)}\nZone : ${o.zone}\n${o.address}`;
cart={};draw();$('#dC').classList.remove('on');open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),'_blank');alert('Commande enregistrée ✔')};
const ST=['en_attente','en_preparation','en_livraison','livrée'];
$('#bO').onclick=async()=>{let l=[];if(sb){if(!user)return alert('Connectez-vous');l=(await sb.from('orders').select('*').order('created_at',{ascending:false})).data||[]}else l=JSON.parse(localStorage.o||'[]').reverse();
$('#ol').innerHTML=l.map(o=>`<div class="it" style="display:block"><b>${F(o.total)}</b> · ${o.paid?'✅ payée':'⏳ non payée'}<br><small>${new Date(o.created_at).toLocaleDateString('fr-FR')} · ${o.items.map(i=>i.name+' ×'+i.qty).join(', ')}</small><div class="st">${ST.map((s,i)=>`<i class="${i<=ST.indexOf(o.status)?'d':''}"></i>`).join('')}</div><small>${o.status.replace('_',' ')}</small></div>`).join('')||'<small>Aucune commande</small>';op('#dO')};
async function who(){if(!sb||!user)return isAdm=false,$('#bG').style.display='none';const r=await sb.from('profiles').select('role').eq('id',user.id).single();isAdm=r.data?.role==='admin';$('#bG').style.display=isAdm?'':'none'}
async function load(){if(!sb)return;const z=await sb.from('zones').select('*').order('name');if(z.data?.length)zones=z.data;const t=await sb.from('settings').select('v').eq('id',1).single();if(t.data)TF=t.data.v;const p=await sb.from('products').select('*').eq('id','karite').single();if(p.data)PK=p.data.price;draw()}
(async()=>{if(sb){const s=await sb.auth.getSession();if(s.data.session){user=s.data.session.user;$('#bA').textContent='Déconnexion'}await who();await load()}})();
// Gestionnaire
const wk=v=>{if(!v)return[0,9e15];const[y,w]=v.split('-W').map(Number),d=new Date(Date.UTC(y,0,4));d.setUTCDate(d.getUTCDate()-((d.getUTCDay()||7)-1)+(w-1)*7);return[+d,+d+6048e5]};
async function gv(t){const V=$('#gv');document.querySelectorAll('#gt button').forEach(b=>b.classList.toggle('on',b.dataset.g==t));
if(t=='o'){const{data}=await sb.from('orders').select('*').order('created_at',{ascending:false});window._o=data||[];V.innerHTML='<input type="week" id="fw"><input id="fc" placeholder="Filtrer par client / téléphone"><div id="fo"></div>';$('#fw').onchange=$('#fc').oninput=fo;fo()}
if(t=='z'){const{data}=await sb.from('zones').select('*').order('id');V.innerHTML=(data||[]).map(z=>`<div class="row"><input id="zn${z.id}" value="${z.name}"><input id="zf${z.id}" type="number" value="${z.fee}" style="width:110px"><button class="ic" data-sz="${z.id}">OK</button><button class="ic" data-dz="${z.id}">✕</button></div>`).join('')+'<div class="row"><input id="nz" placeholder="Nouvelle zone / distance"><input id="nf" type="number" placeholder="Prix" style="width:110px"><button class="ic" data-az>Ajouter</button></div>'}
if(t=='t'){V.innerHTML=[['detail','Prix détail'],['gros_min','Gros : à partir de (pièces)'],['gros','Prix gros'],['demi','Demi-carton (25)'],['carton','Carton (50)'],['carton2','Carton dès 2 cartons']].map(([k,l])=>`<small>${l}</small><input data-k="${k}" type="number" value="${TF[k]}">`).join('')+'<button class="cta" data-st>Enregistrer les tarifs</button>'}
if(t=='s'){const{data}=await sb.from('products').select('*');V.innerHTML=(data||[]).map(p=>`<div class="card" style="margin:8px 0"><b>${p.name}</b> — stock : <b>${p.stock}</b><div class="row"><input id="pp${p.id}" type="number" value="${p.price}" title="Prix"><button class="ic" data-pp="${p.id}">Prix</button></div><div class="row"><input id="pe${p.id}" type="number" placeholder="Entrée (+)"><button class="ic" data-pe="${p.id}" data-s="${p.stock}">Ajouter</button></div></div>`).join('')}}
function fo(){const[a,b]=wk($('#fw').value),c=$('#fc').value.toLowerCase();$('#fo').innerHTML=window._o.filter(o=>{const d=+new Date(o.created_at);return d>=a&&d<b&&(o.name+o.phone).toLowerCase().includes(c)}).map(o=>`<div class="it" style="display:block"><b>${o.name}</b> · ${o.phone} · ${o.zone}<br><small>${new Date(o.created_at).toLocaleDateString('fr-FR')} · ${o.items.map(i=>i.name+' ×'+i.qty).join(', ')} · ${o.address||''}</small><br><b>${F(o.total)}</b> (livr. ${F(o.fee||0)})<div class="row"><select data-os="${o.id}">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><label><input type="checkbox" data-op="${o.id}" ${o.paid?'checked':''} style="width:auto"> payée</label></div></div>`).join('')||'<small>Aucune commande</small>'}
$('#bG').onclick=()=>{op('#dG');gv('o')};
document.addEventListener('click',async e=>{const d=e.target.dataset,V=()=>gv(document.querySelector('#gt .on').dataset.g);
if(d.g)gv(d.g);
if(d.sz){await sb.from('zones').update({name:$('#zn'+d.sz).value,fee:+$('#zf'+d.sz).value}).eq('id',d.sz);load();alert('Zone mise à jour')}
if(d.dz&&confirm('Supprimer cette zone ?')){await sb.from('zones').delete().eq('id',d.dz);await load();V()}
if('az'in d&&$('#nz').value){await sb.from('zones').insert({name:$('#nz').value,fee:+$('#nf').value||0});await load();V()}
if('st'in d){const n={};document.querySelectorAll('[data-k]').forEach(i=>n[i.dataset.k]=+i.value);const r=await sb.from('settings').update({v:n}).eq('id',1);if(!r.error){TF=n;draw();alert('Tarifs enregistrés')}}
if(d.pp){await sb.from('products').update({price:+$('#pp'+d.pp).value}).eq('id',d.pp);await load();alert('Prix mis à jour')}
if(d.pe){await sb.from('products').update({stock:+d.s+(+$('#pe'+d.pe).value||0)}).eq('id',d.pe);V()}});
document.addEventListener('change',async e=>{const d=e.target.dataset;if(d.os)await sb.from('orders').update({status:e.target.value}).eq('id',d.os);if(d.op)await sb.from('orders').update({paid:e.target.checked}).eq('id',d.op)});
draw();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
